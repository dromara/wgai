plc:
  # 是否启用 PLC 真实连接。
  # ⚠ false = 纯调试模式：writeInt16/writeBit 直接 return，一个字节都不往 PLC 写，车绝不会动。
  #   但 [PLC控制] 动作=前进 ... 实发rpm=12 这行日志**照打不误**(logControlCommand 无条件输出)，
  #   看着像下发成功了，极具迷惑性。2026-08 曾因此把"车不动"一路误查到 Nav2/TF/点云链路。
  #   启动日志里认这两行才作数：
  #     [PLC] 调试模式 (plc.enabled=false), 不实际连接      ← 出现就是没连
  #     AGV PLC bridge started | ... | enabled=true         ← 这样才是真连
  enabled: false
  # PLC 桥接预热：false 时 RobotHardwareService 不启动定时任务、不加载 PLC 连接。
  # 需要真实 PLC 时，bridge.enabled 和 enabled 必须同时设为 true。
  bridge:
    enabled: false
  # Smart200 PLC IP
  host: 192.168.2.20
  # S7 TCP 端口，Smart200 默认 102
  port: 102
  # S7 TCP rack，Smart200通常为 0
  rack: 0
  # S7 TCP slot，Smart200通常为 1
  slot: 1
  # 看门狗超时；超过该时间未收到新的 /cmd_vel 指令，自动停车
  watchdog:
    ms: 500
  # PLC 控制意图日志输出间隔；用于观察“前进/右转/旋转”等下发内容
  control:
    log:
      interval:
        ms: 500
  # ── 自动导航前向避障(ObstacleGuardService) ─────────────────────────────
  # 逐帧从点云里量"车头正前方那条走廊里最近的东西有多远"，超阈值就把自动导航的速度截停。
  # ⚠ 只作用于自动导航(Nav2 /cmd_vel)，手动遥控和点位测试不受它拦。
  obstacle:
    stop:
      # 车头前方净空小于该值就停；量的是**还能再往前开多少米**(打舵时是弧长)，不是离雷达的直线距离。
      # 0 = 关闭该保护。前端「障碍停车距离」也能运行时改(/api/plc/obstacle-threshold)，改完立即生效、不持久化。
      # 0.35/0.5 现场都不够(车还没刹住)，实测 1.0 才留得出余量
      distance: 1.0
    # 舵角小于该值按直行处理(矩形走廊)，否则走圆弧扫掠判定
    straight-angle-deg: 1.0
    # 保险杠兜底：打舵时车头正前方这一段仍按直线矩形判，和圆弧扫掠取最小值。
    # 圆弧几何依赖 wheelbase-m/rear-axle-x-m 这两个估算值，估偏了走廊会弯过头漏掉正前方的东西；
    # 这一段是不管舵角多大都不会漏的底线。0 = 关闭(不建议)
    bumper-guard-m: 2.0
    # 走廊在车宽(左1.2+右0.9)基础上左右各再放宽多少米，覆盖定位误差和车体摆动
    corridor-margin-m: 0.3
    # 走廊往前看多远。再远的东西交给 Nav2 自己绕，不参与急停判定
    corridor-range-m: 8.0
    # 同一距离档位里至少要有几个点才算真障碍。1~2 个飞点/雨雾回波就能把净空拉到 0.2m，
    # 不设门限自动导航会被一路刹停
    min-points: 3
    # 距离分档粒度(米)，min-points 是在同一档内计数的
    bucket-m: 0.10
    # 判定结果超过多久没刷新就视为失效。fail-safe：点云链路断了 = 禁止自动导航继续走，
    # 不是默认放行。只在"曾经出过结果"之后才生效，免得没接雷达的环境被永久锁死
    stale-ms: 2000
  # ── PLC 点位测试(限时点动) ─────────────────────────────────────────────
  # 开自动之前逐条验点位用，见 /api/plc/test。点动期间独占底盘，/cmd_vel 一律丢弃。
  test:
    # 测试窗转速上限，钳位用。测试窗不该让车窜出去
    max-rpm: 500
    # 单次点动最长保持时间，到点自动 forceStop 并把模式字复位成直行。
    # 不存在"忘了点停车"这种情况
    max-hold-ms: 3000
  # 轮径(米)，现场确认 0.452m
  wheel:
    diameter-m: 0.452
    # VW1004 速度标定系数。|v|×60/(π×轮径) 算出来的是**轮子** r/min，但 VW1004 吃的不是这个刻度：
    # 现场实测 linear=0.3m/s 算出 12 时车几乎不走，×10 才对得上。调车速改这个数，别去改换算公式。
    rpm-scale: 10.0
    # 轮速比(减速比)：VD1212 里程计换算专用(电机转45圈,轮子实际转1圈，需要除)；VW1004 车速走上面的 rpm-scale，不乘此系数
    gear-ratio: 45
    # 等效轴距(m)。转弯半径 R = 等效轴距/tan(前轮舵角)。
    # 车是前轮转向+后轮辅助转向，不是机械轴距，而是 轴距/(1+后轮反打比例)。
    # 标定：舵打满 45° 慢速走一圈，转弯圆心到车身中线的垂直距离就是它。
    # 一处配置三处用：自动导航舵角换算 / 打舵避障圆弧走廊 / Smac 最小转弯半径(MapController 写 yaml)
    # ⚠ 2.1 是按"后轮不转"估的保守值，现场标定后改
    wheelbase-m: 2.1
    # 转向中心线在车体系的 x(负=雷达后方)，转弯圆心落在这条横线上。
    # 只有前轮转向时是后轴(-2.80)；后轮辅助转向会让它往底盘中心(-1.75)挪。
    # 同时是 Nav2 的 base_link 原点(launch 按 nav2 yaml 里的 agv_base_link 段发 body→base_link 静态 TF)
    rear-axle-x-m: -2.80
  # PLC 写入去重：PLC 经 PAD 同一个 WiFi 网关通信。速度/角度周期下发时值没变就不重复写，
  # 每 refresh-ms 保底刷新一次；值一变立刻写。急停/停车/切模式不受影响。0 = 每拍都写(回退)
  write:
    refresh-ms: 200
  steer:
    # 自动导航舵角换算：1=运动学 atan(等效轴距×ω/v)；0=旧的 -ω×angular.scale(与车速无关，弯道外甩，仅回退用)
    mode: 1
    # 起步/换向打舵：先写角度、速度 0、方向位 0，VW1208 转角反馈进入 ±此值才置方向位起步。
    # 舵轮转到位要时间，角度和前进一起下发时车轮没转过去车就走了
    ready-tol-deg: 1.0
    # 起步打舵超过这么久没到位 → 报警、继续不起步(Nav2 会因为走不动报失败)
    ready-timeout-ms: 3000
    # 行驶中转角反馈与目标差超过此角度 → 限速到 slow-rpm，等舵轮追上
    slow-error-deg: 5.0
    slow-rpm: 50
    # 转角反馈读取间隔(ms)。PLC 走 WiFi 网关，别调太小：S7 一次一条，读得越勤急停越要排队。舵本来转得慢，200 够用
    feedback-interval-ms: 200
  # VD1212 编码器脉冲分辨率(每转脉冲数)，用于位置反馈换算成米；现场未确认前仅供参考
  encoder:
    counts-per-rev: 10000
  # ROS angular.z 到 PLC 转弯角度(VW1006)的缩放系数；角度会限制在 -45~45 度
  angular:
    scale: 30.0
  # 自动导航(Nav2 /cmd_vel)限速上限，VW1004 r/min；只限制自动导航来源的指令，手动遥控不受影响
  # Nav2 请求更低速度(接近目标点减速/避障)时仍然可以更慢，只是不会超过此值
  auto-nav:
    max-rpm: 500

  # ── 自动导航倒车限制 ───────────────────────────────────────────────────
  # 雷达在车头，车尾后面基本是盲区，前向避障走廊管不到倒车 → 只能靠慢 + 短
  reverse:
    # 倒车限速(VW1004)，和 auto-nav.max-rpm 取小
    max-rpm: 100
    # 单段连续倒车最长距离(m，按 /Odometry 实测)。超过就不再执行倒车指令，出现前进指令或发新目标后解除。0=禁止自动倒车
    max-distance-m: 2.0

  # ── 起点/终点机动(ManeuverService)：原地旋转 VW1002=1、平移 VW1002=2 ─────────
  # 路上仍是 Nav2 直行模式；机动只在 ①起点目标在身后时预旋转 ②终点朝向/横向对位 ③Nav2 失败且一侧太挤时侧移重试一次
  # 每个动作前必须同时过「点云」和「静态地图」判定，任一不过就不动
  maneuver:
    enabled: true
    # 切模式后等 V1200.2/V1200.3 模式反馈点亮的最长时间(舵轮要转到位)
    mode-switch-timeout-ms: 8000
    # 机动续命超时。不能用 watchdog.ms(500)：机动每拍读里程计+写 S7，PLC 忙时一拍几百毫秒，会把平移半路掐断
    watchdog-ms: 2000
    # 目标方位与车头相差超过此角度才预旋转(目标在身后)
    pre-rotate-min-deg: 100
    # Nav2 到达后是否做终点对位(侧向对位的目标总会做)
    goal-align: true
    yaw-tol-deg: 3.0
    lateral-tol-m: 0.05
    # 单次平移上限。车身后段两侧雷达看不全，不许一口气横移太远
    lateral-max-m: 1.0
    # 平移后车身侧边离障碍至少留多少
    lateral-margin-m: 0.3
    # VW1004。⚠ 旋转/平移模式下这个数对应多快未标定，先按低速现场试
    rotate-rpm: 150
    rotate-slow-rpm: 50
    rotate-slow-deg: 15
    lateral-rpm: 100
    lateral-slow-rpm: 40
    lateral-slow-m: 0.2
    # 单个动作最长时间(含切模式)
    timeout-ms: 60000
    # 停车后等多久再判定：旋转判定要累积约 1s 点云扇区
    settle-ms: 1500
    # Nav2 失败后，较近一侧净空 < corridor-tight-m 时平移摆中(最多 corridor-shift-max-m)再重发一次
    # 发目标后这么久没出路径就判定规划失败 → 取消 Nav2、诊断、侧移重试。要大于 Smac max_planning_time(10s)
    plan-timeout-ms: 12000
    corridor-shift: true
    corridor-tight-m: 0.4
    corridor-shift-max-m: 0.6

  # ── 原地旋转(VW1002=1)安全判定 ─────────────────────────────────────────
  # 车体 5.5m×2.1m，原地转一圈扫出的是一个圆，必须确认圆内无障碍物才允许转。
  # 判定逻辑见 RotationSafetyService，只做判定不下发旋转指令。
  rotate:
    # 旋转中心(底盘 2.1×2.1 的中心)在雷达后方多少米。
    # footprint 前0.5m/后5.0m，横向雷达不在中线上(左1.2m/右0.9m)，扫转半径取较大侧1.2m
    # R = max(√((0.5+d)²+1.2²), √((5.0-d)²+1.2²))
    #   d=1.75 → R=3.46m(底盘在车身正中，也是理论最小值)
    #   d=0    → R=5.14m(按雷达原点算，最保守)
    # ⚠ 现场实测确认，改错会导致净空判定偏乐观 → 直接撞车
    center-offset-m: 1.75
    # 扫转圆外再留的安全余量
    safety-margin-m: 0.5
    # 雷达安装高度(离地)。点云 z 靠它换算成离地高度，需现场实测
    # ⚠ 曾误配 2.0，会把离地 1~2m 的障碍物(人/料堆)算成负高度被当地面滤掉 → 旋转判定漏检
    lidar-height-m: 1.0
    # 车体总高，高于此高度的点撞不到车，忽略
    vehicle-height-m: 2.3
    # 地面滤除高度，低于此离地高度的点视为地面反射
    ground-clearance-m: 0.10
    # 扇区数据有效期(滚动窗口)。mid360 是非重复扫描，单帧覆盖不全，需累积多帧
    cloud-window-ms: 1000
    # 最低方位角覆盖率，低于此值判定为"数据不足"并禁止旋转(无数据≠安全)
    min-coverage: 0.80
    # 判定车体静止的阈值，超过则清空已累积扇区(车一动，车体系下的累积数据就失效了)
    stationary-tolerance-m: 0.20
    stationary-tolerance-rad: 0.10

# ── 建图出图方式 ─────────────────────────────────────────────────────────
mapping:
  # grid(默认) = 用 Java 实时累积的占据栅格出图(MappingGridService)。
  #              保存时不发 SIGINT、不碰 fast_lio、不重启整栈，秒级完成，
  #              保存完 Nav2 一直活着，可以马上继续导航。「清空重扫」也变成瞬时。
  # pcd        = 老流程。SIGINT 杀 fast_lio 逼它落盘 PCD → python 转 pgm → 整栈重启(20s+)。
  #              数据源是 fast_lio 自己内存里那份，不受 Java 断连影响。
  #              只在怀疑栅格图不对(比如 Java 中途重启过、缺了一段)时临时切回来用。
  save-mode: grid
  grid:
    # 栅格分辨率(米/格)。⚠ 累积时就定死了，/save 传的 resolution 改不了它，
    # 要变必须改这里再重新建图。和 nav2 costmap 的 resolution 保持一致。
    resolution: 0.05
    # 累积时的粗筛高度门限，单位米，坐标是 camera_init 系的 z(原点=雷达开机位置，不是地面)。
    # 放得比保存时的 zMin/zMax 宽，好让保存时还能再筛一次。
    z-min: -5.0
    z-max: 10.0
    # 一个格子至少被多少「帧」看到才写进地图，用来滤掉建图时从旁边走过的人。
    # ⚠ 必须按「帧」计数不是按「点」：人身上一帧就有十几个点落在同一格，
    #   按点算 hits 直接虚高过门限，过滤等于没做。
    #
    # 默认 1 = **不过滤**(现场定的)。帧数门限分不清"走过的人"和"只被瞥了两眼的稀疏静态物"：
    # 细立柱、远处料堆边缘、掠射角打到的墙面本来就只有几帧回波，会被一起切掉，
    # 出图缺一块比留个把行人严重得多，而且砍掉了什么是静默的、事后查不出来。
    # 动态物改由前端「擦除」框选处理(看着图圈、可撤销)。
    # 想恢复过滤就调到 2~3，前端「动态物过滤」输入框也能运行时覆盖，都不用改代码。
    min-hits: 1

# ── 常驻导航栈(rosbridge + 雷达 + fast_lio + pc2scan + Nav2) ──────────────
# 建图不再单独启 fast_lio，直接复用这个 launch 拉起的那一个。
# save-mode=pcd 时保存地图才会 SIGINT 掉 fast_lio 并由 MappingController 自动重启整栈；
# 默认的 grid 模式全程不动进程。
ros:
  # Java 启动阶段是否检查或创建 nav2_params_fastlio.yaml。
  map:
    startup-init:
      enabled: false
  nav2:
    # global_costmap 车身外扩(m)。Smac 只判车身轮廓线压没压到障碍格，要硬性留余量只能把车身撑大。
    # 窄车位/窄通道进不去时往下调(0.05~0.10)，发目标前的车身预检查也用这个值。
    # ⚠ 调小后车离墙更近，现场确认定位精度够再调；不要调到 0
    footprint-padding: 0.15
    # Nav2 到达判定。朝向容差 > 3.14 = 不检查朝向：这台车不能原地转着对朝向，
    # RPP 为了凑朝向会在终点来回磨("到了一直左右转调整身位")。要精确停车用前端「精确停车」勾选项
    xy-goal-tolerance: 0.30
    yaw-goal-tolerance: 3.15
    # ── Smac 路径形状(改完走「重启 Java → 前端切一次地图 → 重启 ROS 栈」) ──
    # 倒车代价倍数。2.0 时点车后方的目标会规划成"往前开出去掉头绕一圈"；1.0 又会随手插倒车段、前后来回。1.5 折中
    # ⚠ 真倒车时还受 plc.reverse.max-distance-m(单段倒车上限，参数页可改)约束，车尾是雷达盲区
    reverse-penalty: 1.5
    # 左右换向代价。0 时路径左右交替成一截截小弯(平滑是关的，小弯会原样留下)。路径还是抖就往 2.0 调
    change-penalty: 1.0
    # 走弯路代价倍数(≥1)。越大越偏好直线，但过大时窄处宁可绕远也不肯拐
    non-straight-penalty: 1.3
    # Smac 最小转弯半径 = plc.wheel.wheelbase-m / tan45° × 本系数。
    # 按物理极限规划的话 RPP 跟踪时没有舵角余量纠偏，留 20%。拐不进窄弯可往 1.0 靠，弯道压线往上调
    # ⚠ 写进 nav2 yaml，要「重启 Java → 前端切一次地图 → 重启 ROS 栈」才生效
    turn-radius-factor: 1.2
  # ── fast_lio 掉线看门狗(2026-09-18) ────────────────────────────────────
  # 现场症状:脚本跑久了建图就没点云,Nav2 一直刷
  #   Invalid frame ID "camera_init" ... frame does not exist
  # = fast_lio 进程没了。camera_init→body 这条 TF 和 /cloud_registered 都是它出的。
  # 在此之前 Java 对这件事毫无感知,照样推位姿、照样攒栅格。
  fastlio-watchdog:
    enabled: true
    # 多久没收到 /Odometry 才开始怀疑。fast_lio 正常 50Hz,4s 已经非常宽松
    odom-timeout-ms: 4000
    check-interval-ms: 1000
    # 告警去重间隔
    alarm-interval-ms: 15000
    # ⚠ 默认 false —— 掉线只急停+告警,整栈重启交给人工点(导航页/POST /ros2/mapping/recover-stack)。
    #   导航途中自动重启整栈会让 AMCL 定位和当前导航目标一起作废,车可能停在半路
    #   而上位机以为一切正常,比"停在原地等人来看"危险得多。
    #   真要开:重启后 camera_init 原点会跳到车当前位置,必须重设初始位姿。
    auto-restart: false
    # 自动重启的最小间隔,防止 fast_lio 起不来时无限重启风暴
    restart-cooldown-ms: 300000
  robot-full:
    launch-file: /home/ros/robot_full.launch.py
    # Java 起的子进程不继承人工终端的 source，这两个 setup.bash 必须显式 source
    ros-setup: /opt/ros/humble/setup.bash
    # 等导航栈就绪的时间。robot_full.launch.py 里 Nav2 是 T+12s 才启动，要留够余量
    ready-wait-ms: 20000
    # 车体自身遮挡过滤(livox_self_filter.py)。保存地图后 Java 自动重启栈时透传成 SELF_FILTER 环境变量。
    # ⚠ 必须和你人工 ros2 launch 时用的值一致，不然重启后过滤会悄悄关掉、下一张图又出车体重影。
    #
    # 默认 true —— 不过滤的话车体自身点会同时污染建图和导航:
    #   建图: 车体轮廓被写进 PCD，且 fast_lio 被这些静止强反射点拽住 → 前后错位的重影
    #   导航: 落在 pc2scan 高度带(0.1~1.5m)内 → /scan 上的假障碍，还会挡住清障射线
    #
    # 唯一该关掉的情况: 过滤节点跟不上 mid360 的帧率、开始积压。
    # 判据 `ros2 topic delay /livox/lidar_filtered` 单调上涨(2026-08 实测过到 41s)，
    # 此时 fast_lio 会拿过期点云配准并把位姿发散成百万米级，比重影严重得多。
    # 真遇上应该去修过滤实现(改 C++)，而不是长期关着过滤跑。
    self-filter: true
